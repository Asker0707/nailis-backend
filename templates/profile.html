{% extends "base.html" %}
{% block title %}Профиль | Nailis.hub{% endblock %}

{% block extra_css %}
  <link href="/static/css/pages/profile.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="profile-page">
  <div id="profile-content">
    <div class="profile-loading">
      <div class="profile-loading-card profile-reveal" style="--delay: 20ms;">
        <div class="spinner-border mb-3" style="width: 2.4rem; height: 2.4rem; color: #5f5f67;" role="status">
          <span class="visually-hidden">Загрузка...</span>
        </div>
        <div class="shimmer a"></div>
        <div class="shimmer b"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="/static/js/profile.js" defer></script>
{% endblock %}

# Рекламная главная Nailis.hub — статический сайт.
# Замените example.ru на свой домен (4 места) и положите файл в
# /etc/nginx/sites-available/nailis.conf (подробно — deploy/landing/README.md).

# http → https; здесь же certbot подтверждает домен
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://example.ru$request_uri;
    }
}

# www → без www
server {
    # http2 так (а не «http2 on;») — совместимо с nginx 1.24 из Ubuntu 24.04
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.ru;

    ssl_certificate /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    return 301 https://example.ru$request_uri;
}

server {
    # http2 так (а не «http2 on;») — совместимо с nginx 1.24 из Ubuntu 24.04
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ru;

    root /var/www/nailis/landing;

    ssl_certificate /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nailis_ssl:10m;
    ssl_session_timeout 1d;

    include snippets/nailis-site.conf;
}

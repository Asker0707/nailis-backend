# Заголовки безопасности. Подключается в КАЖДЫЙ location: add_header внутри
# location отменяет унаследованные с уровня server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Сайт грузит всё только со своего домена (шрифты, GSAP, Bootstrap — локально).
# style 'unsafe-inline' — для style="--…" в разметке и <style> на странице 404.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Браузеры будут ходить только по https (по http этот заголовок игнорируется)
add_header Strict-Transport-Security "max-age=15552000" always;

# Общие правила статического сайта (root задаётся в server).
charset utf-8;
server_tokens off;
absolute_redirect off;
index index.html;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript image/svg+xml application/xml text/plain font/ttf font/otf application/vnd.ms-fontobject;

error_page 404 /404.html;

# HTML — всегда свежий (после деплоя посетители сразу видят новую версию)
location / {
    # /privacy → privacy/index.html без лишнего редиректа на /privacy/
    try_files $uri $uri/index.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include snippets/nailis-headers.conf;
}

location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    include snippets/nailis-headers.conf;
}

# CSS/JS проекта подключаются с ?v=<хэш> — их можно кэшировать навсегда
location ~ ^/static/(css|js)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/nailis-headers.conf;
}

# Шрифты не меняются
location ~* ^/static/.+\.(woff2?|ttf|otf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    include snippets/nailis-headers.conf;
}

# Остальная статика (фото, видео, библиотеки) — неделя
location /static/ {
    add_header Cache-Control "public, max-age=604800" always;
    include snippets/nailis-headers.conf;
}

# служебные файлы не отдаём
location ~ /\. {
    deny all;
}

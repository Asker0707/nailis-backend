# Временный конфиг на первые минуты: только http, чтобы certbot получил
# сертификат. После получения сертификата замените на nailis.conf.
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;
    root /var/www/nailis/landing;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
